name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ls -la
          ZIP=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: repo-te kono zip file nei"
            exit 1
          fi
          echo "Found: $ZIP"
          unzip -q "$ZIP" -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          GR=$(find project -name gradlew | head -n 1)
          cd "$(dirname "$GR")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/**/build/outputs/apk/debug/*.apk
